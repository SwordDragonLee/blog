# 前台博客 ljl0628.cn：/ 反代 Next.js 容器，/api 直连 server 容器。

# ── HTTP（备案期间与演练阶段直接用 80 出内容；HTTPS 上线后本块替换为 301 跳转）──
server {
    listen 80;
    server_name ljl0628.cn www.ljl0628.cn;
    client_max_body_size 10m;

    # RAG 问答 SSE：必须关缓冲 + 拉长读超时，否则前端一次性收到全文而非逐字流
    location = /api/v1/portal/ask {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 其余 API：文章列表/详情、SVG 配图、点赞
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Next.js（SSR/ISR/静态资源）；Upgrade 头保留给 Next 的 HMR/WebSocket 场景
    location / {
        proxy_pass http://blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

