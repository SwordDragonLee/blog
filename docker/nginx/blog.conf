# 前台博客 ljl0628.cn：/ 反代 Next.js 容器，/api 直连 server 容器。
# HTTPS 已上线：80 全部 301 到 443；证书 = 腾讯云免费 TrustAsia（DNS 验证），
# 挂载自 compose 的 ./nginx/certs → /etc/nginx/certs。

# ── HTTP：全部 301 到 HTTPS（保留 $host，主域/www 各自跳到自己的 https）──
server {
    listen 80;
    server_name ljl0628.cn www.ljl0628.cn;
    return 301 https://$host$request_uri;
}

# ── HTTPS 主域 + www ──
# 腾讯云免费 TrustAsia 证书：按裸域申请会自动附赠 www（一张证书 SAN 覆盖两个域名），
# 所以一个证书块即可同时服务主域与 www，无需单独的 www 证书。
# nginx 格式下载包内文件为 <域名>_bundle.crt（证书+链）与 <域名>.key。
server {
    listen 443 ssl;
    http2 on;
    server_name ljl0628.cn www.ljl0628.cn;
    ssl_certificate     /etc/nginx/certs/ljl0628.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/ljl0628.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;

    # RAG 问答 SSE：必须关缓冲 + 拉长读超时，否则前端一次性收到全文而非逐字流
    location = /api/v1/portal/ask {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 其余 API：文章列表/详情、SVG 配图、点赞
    location /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Next.js（SSR/ISR/静态资源）；Upgrade 头保留给 Next 的 HMR/WebSocket 场景
    location / {
        proxy_pass http://blog:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

