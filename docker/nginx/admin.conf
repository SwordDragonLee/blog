# 管理端 admin.ljl0628.cn：整站转给 admin 容器（容器自带 nginx 托管静态文件并反代 /api）。
# 证书 = 腾讯云免费 TrustAsia 单域名证书（nginx 格式下载包：<域名>_bundle.crt + <域名>.key）。

server {
    listen 80;
    server_name admin.ljl0628.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.ljl0628.cn;
    ssl_certificate     /etc/nginx/certs/admin.ljl0628.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/admin.ljl0628.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
