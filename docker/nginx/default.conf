# 兜底 server 块：用 IP 或未配置的域名直连时直接断开，
# 覆盖 nginx 镜像自带的 default.conf 欢迎页（compose 按文件名逐个挂载到 conf.d/）。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 443 侧同理：SNI 不匹配任何 server_name（如扫 IP 的 https 请求）时拒绝握手。
# ssl_reject_handshake（nginx ≥1.19.4）无需证书即可拒连，否则 default_server 的
# ssl 监听要求必须有证书，会让 nginx -t 失败。
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
