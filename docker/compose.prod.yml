# 生产编排：nginx 统一入口 + server/blog/admin 三端 + 四中间件，共 8 个服务。
# 与本地 deploy/docker-compose.yml 的关键差异：
#   1. 中间件端口一律不映射宿主机（只有 nginx 的 80/443 对外）；RabbitMQ 管理界面绑回环走 SSH 隧道
#   2. 全部服务 restart: unless-stopped + 日志限额，named volume 持久化（向量库数据必须落盘）
#   3. 镜像在本机构建、save/scp/load 上云（2C4G 禁止在服务器上构建）
# 用法（/opt/blog 下，同目录需有 .env、config.yaml、nginx/*.conf）：
#   docker compose -f compose.prod.yml up -d
name: blog

# 日志限额锚点：防容器日志吃满磁盘（每个容器最多 3 个 10m 文件）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── 统一入口 ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/blog.conf:/etc/nginx/conf.d/blog.conf:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/admin.conf:ro
      # 兜底块覆盖镜像自带 default.conf（IP 直连返回 444）
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录：阶段 4 放入 pem/key；为空不影响 nginx 启动（443 块处于注释状态）
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - server
      - blog
      - admin
    logging: *default-logging

  # ── 三端 ────────────────────────────────────────────────
  server:
    image: blog-server:latest
    container_name: blog-server
    restart: unless-stopped
    # 配置只有一份（server/config.yaml，不含密钥）：拓扑固定项由下面 environment 注入，
    # 密钥/主机相关项经 env_file 注入（键名对应 config 配置项，见 env.production.example）
    env_file:
      - .env
    volumes:
      # 默认挂 compose 同目录 config.yaml；本机演练在 .env 设
      # SERVER_CONFIG_PATH=../server/config.yaml 直接用仓库配置，无需复制
      - ${SERVER_CONFIG_PATH:-./config.yaml}:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
      # compose 拓扑固定项（非私密）：覆盖 config.yaml 里的本机开发地址
      - SERVER_MODE=release
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_ADDR=redis:6379
      - QDRANT_BASE_URL=http://qdrant:6333
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      # /metrics 无鉴权、不碰业务库，适合做存活探测
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/metrics >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  blog:
    image: blog-blog:latest
    container_name: blog-blog
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      server:
        condition: service_healthy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  admin:
    image: blog-admin:latest
    container_name: blog-admin
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    logging: *default-logging

  # ── 四中间件（一律不映射公网端口）──────────────────────────
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    # 生产必须设密码（config.yaml 的 redis.password 与之保持一致）
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3-management
    container_name: blog-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?请在 .env 中设置 RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请在 .env 中设置 RABBITMQ_DEFAULT_PASS}
      TZ: Asia/Shanghai
    # 管理界面只绑回环：公网不可达，需要看时走 SSH 隧道 ssh -L 15672:localhost:15672 root@<IP>
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    logging: *default-logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  qdrant:
    # 版本钉死与本地索引一致（latest 升级可能改向量格式导致兼容问题）
    image: qdrant/qdrant:1.19.1
    container_name: blog-qdrant
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - qdrant-data:/qdrant/storage
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  qdrant-data:
